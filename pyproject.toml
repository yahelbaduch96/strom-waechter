[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strom-waechter"
version = "1.0.0"
description = "Industrial Energy Cost Optimization Web Application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0"
]

[tool.setuptools]
packages = ["."]