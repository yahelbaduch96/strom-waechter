[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strom-waechter"
version = "1.0.0"
description = "AI Developer Challenge: Energy cost optimization CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "rich>=13.7.0"
]

[project.scripts]
strom-waechter = "dev.strom_waechter:main"

[tool.setuptools]
packages = ["dev"]